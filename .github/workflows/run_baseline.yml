name: Validate archived V1 PathMNIST baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3 matplotlib==3.9.2 scikit-learn==1.5.2 nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.29.5 ipython==8.30.0
      - name: Execute to temporary artifacts; archived notebooks remain unchanged
        env:
          V1_BASELINE_OUTPUT_DIR: ${{ runner.temp }}/comp5318-v1-baseline
        run: python archive/v1/scripts/execute_baseline.py
      - uses: actions/upload-artifact@v4
        with:
          name: v1-baseline-validated
          path: ${{ runner.temp }}/comp5318-v1-baseline/
          if-no-files-found: error
