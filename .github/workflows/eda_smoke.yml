name: Validate Chinese EDA application

on:
  workflow_dispatch:
  push:
    paths:
      - 'eda_lab/**'
      - 'scripts/smoke_eda.py'
      - '.github/workflows/eda_smoke.yml'

permissions:
  contents: read

jobs:
  eda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install EDA-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.5.2 streamlit==1.39.0 plotly==5.24.1 pillow==10.4.0
      - name: Check Python syntax and run interactive UI smoke test
        run: |
          python -m py_compile eda_lab/app.py scripts/smoke_eda.py
          python scripts/smoke_eda.py
