name: Review Canvas A2 specification text
on:
  push:
    paths:
      - '.github/workflows/v3_canvas_spec_review.yml'
  workflow_dispatch:
jobs:
  read-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract original Canvas text for rubric audit
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdfinfo "Canvas Sources/COMP5318-assignment2-Sem2-2026-2.pdf" | head -20
          pdftotext -layout "Canvas Sources/COMP5318-assignment2-Sem2-2026-2.pdf" - | sed -n '1,360p'
